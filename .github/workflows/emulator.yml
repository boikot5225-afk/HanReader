name: HanReader on emulators
# The smoke test (app/src/androidTest) on real Android systems: an old small phone,
# a typical phone, a new tablet. Separate from the main build so the beta link is not delayed.
on:
  push:
    branches: [main, 'ccr-*', es, amauta, 'experiment/**', 'claude/**']
  workflow_dispatch:
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            profile: Nexus 4
            name: Android 8, small phone
          - api: 30
            profile: pixel_5
            name: Android 11, phone
          - api: 34
            profile: Nexus 10
            name: Android 14, tablet
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Hardware acceleration for the emulator on GitHub's Linux machines.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build the app and the test
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Smoke test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # On a failure: the emulator's warnings and errors go to this log (the report is only an artifact).
          script: gradle :app:connectedDebugAndroidTest --stacktrace || (adb logcat -d -v time '*:W' | grep -v -E 'chatty|netd|wificond' | tail -n 300; exit 1)
      - name: Failed test details
        if: failure()
        run: find app/build/outputs/androidTest-results -name '*.xml' -exec grep -l '<failure' {} + | xargs -r cat | head -c 60000
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-report-api${{ matrix.api }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
