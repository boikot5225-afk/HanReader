name: HanReader Android CI
on:
  push:
    # main and the working branches: every change gets a tested APK.
    # experiment/** and claude/**: tests and an APK artifact only, never the public beta.
    branches: [main, 'ccr-*', 'experiment/**', 'claude/**']
  workflow_dispatch:
# Two pushes in a row: the newer build replaces the older one.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # write: to publish the beta APK as a release asset.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The hosted Ubuntu runner already includes Android command-line tools.
      # setup-android@v3 tries to install obsolete SDK package "tools" and fails.
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      # A permanent public link for testers: the latest APK, replaced on every successful build.
      # https://github.com/<owner>/<repo>/releases/download/beta/HanReader-beta.apk
      - name: Publish beta APK
        # Only main and ccr-* publish the beta; an experimental branch must not replace it for testers.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || startsWith(github.ref_name, 'ccr-'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/HanReader-beta.apk"
          BUILD="HanReader $VERSION (тестовая сборка) · ветка ${GITHUB_REF_NAME} · коммит ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M') UTC"
          # The public page of the release: what the app is, how to install it, contacts.
          { cat store/RELEASE_NOTES_ru.md; printf '\n---\n_%s_\n' "$BUILD"; } > "$RUNNER_TEMP/notes.md"
          NOTES="$BUILD"
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --prerelease --target "$GITHUB_SHA" --title "HanReader beta" --notes "$NOTES"
          fi
          gh release upload beta "$RUNNER_TEMP/HanReader-beta.apk" --clobber
          gh release edit beta --title "HanReader beta $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Beta: https://github.com/${GITHUB_REPOSITORY}/releases/download/beta/HanReader-beta.apk" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hanreader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # A stable release is only built after GitHub Actions secrets are configured.
      - name: Load private release key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.HANREADER_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.HANREADER_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.HANREADER_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.HANREADER_KEY_PASSWORD }}
        run: |
          if [[ -n "$SIGNING_KEY_BASE64" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_KEY_ALIAS" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/hanreader-release.p12"
            chmod 600 "$RUNNER_TEMP/hanreader-release.p12"
            echo "HANREADER_KEYSTORE_FILE=$RUNNER_TEMP/hanreader-release.p12" >> "$GITHUB_ENV"
            echo "HANREADER_KEYSTORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "HANREADER_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "HANREADER_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "HANREADER_HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "No release secrets: only the debug APK will be produced."
          fi
      - name: Build signed release APK
        if: env.HANREADER_HAS_RELEASE_KEY == 'true'
        run: gradle :app:assembleRelease --stacktrace
      # The release key's certificate fingerprint, to compare with hanreader-signing-setup.txt.
      - name: Show release signature
        if: env.HANREADER_HAS_RELEASE_KEY == 'true'
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          DIGEST=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          echo "Release signing certificate SHA-256: $DIGEST"
          echo "Подпись релиза (SHA-256): \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed release APK
        if: env.HANREADER_HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hanreader-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
